# Copie este archivo como .streamlit/secrets.toml y llene los valores.
# secrets.toml NO se sube a GitHub (está en .gitignore).
# En Streamlit Cloud, estos mismos valores se pegan en Settings > Secrets.

[servicio]
url_token = "https://<servidor>/TraerToken"
url_proceso = "https://<servidor>/validacion/solicitudvalidacionEstado"
url_guardar = "https://<servidor>/GuardarBiometria"
url_validar = "https://<servidor>/ValidarBiometria"
url_documento = "https://<servidor>/GuardarDocumentoAmbasCaras"
client_id = ""
client_secret = ""
guid_conv = ""
usuario = ""
clave = ""
# 1 = directa, sin enviar SMS ni correo a la persona
tipo_validacion = 1
verificar_ssl = true
# Clave para usar la sección de selfie en la app publicada. Déjela vacía para no pedirla.
clave_app = ""
